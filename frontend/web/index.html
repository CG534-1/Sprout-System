<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=overlays-content">
  <meta name="description" content="Care tracker for plants and pets.">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #F8FEF9;
    }
    /* HOST stays 0×0. The input is parked over the tapped control via
       --sprout-picker-* so iOS anchors the photo menu there. */
    #__image_picker_web-file-input {
      display: block;
      position: fixed;
      width: 0;
      height: 0;
      margin: 0;
      padding: 0;
      border: 0;
      overflow: visible;
      pointer-events: none;
    }
    #__image_picker_web-file-input input {
      display: block !important;
      position: fixed !important;
      left: var(--sprout-picker-left, -9999px) !important;
      top: var(--sprout-picker-top, -9999px) !important;
      width: var(--sprout-picker-width, 1px) !important;
      height: var(--sprout-picker-height, 1px) !important;
      bottom: auto !important;
      right: auto !important;
      max-width: none !important;
      transform: none !important;
      margin: 0;
      padding: 0;
      border: 0;
      opacity: 0.01;
      pointer-events: none;
    }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Sprout">
  <link rel="apple-touch-icon" href="sprout-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="192x192" href="sprout-icon.png">
  <link rel="shortcut icon" href="favicon.ico">

  <title>Sprout</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    (function () {
      var meta = document.querySelector('meta[name="viewport"]');
      if (!meta) return;
      var fix = function () {
        if (meta.content.indexOf('interactive-widget') === -1) {
          meta.content += ', interactive-widget=overlays-content';
        }
      };
      fix();
      new MutationObserver(fix).observe(meta, {
        attributes: true,
        attributeFilter: ['content'],
      });
    })();
    (function () {
      function watch(host) {
        if (host.dataset.sproutPicker) return;
        host.dataset.sproutPicker = '1';
        new MutationObserver(function () {
          var input = host.querySelector('input');
          if (!input) return;
          setTimeout(function () {
            input.style.pointerEvents = 'none';
          }, 500);
        }).observe(host, { childList: true });
      }
      function attach() {
        var host = document.getElementById('__image_picker_web-file-input');
        if (host) watch(host);
      }
      attach();
      new MutationObserver(attach).observe(document.body, { childList: true });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
