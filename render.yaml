services:
  - type: web
    name: sprout-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false

  - type: web
    name: sprout-web
    runtime: static
    buildCommand: bash scripts/render-web-build.sh
    staticPublishPath: frontend/build/web
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      - key: FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_VAPID_KEY
        sync: false

  - type: cron
    name: sprout-reminders
    runtime: node
    rootDir: backend
    schedule: "* * * * *"
    buildCommand: npm install
    startCommand: node scripts/dispatch.js
    envVars:
      - key: API_BASE_URL
        sync: false
      - key: CRON_SECRET
        fromService:
          type: web
          name: sprout-api
          envVarKey: CRON_SECRET
